# The precommit file tells Git what checks to run automatically before each commit.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff #finds code problems automatically fixes them
        args: ["--fix"]
      - id: ruff-format #formats the code autmatically
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black # makes sure the code follows the same style
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy

